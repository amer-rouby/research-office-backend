# Every external setting is an RO_* environment variable (avoids clashing with machine-wide DB_URL/JWT_SECRET).
server:
  port: ${RO_PORT:8090}

spring:
  application:
    name: research-office-backend
  datasource:
    url: ${RO_DB_URL:jdbc:postgresql://localhost:5434/research_office}
    username: ${RO_DB_USERNAME:ro}
    password: ${RO_DB_PASSWORD:ro}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 60MB
  # SMTP (e.g. Brevo free: smtp-relay.brevo.com:587). Leave RO_MAIL_HOST empty to only log emails.
  mail:
    host: ${RO_MAIL_HOST:}
    port: ${RO_MAIL_PORT:587}
    username: ${RO_MAIL_USERNAME:}
    password: ${RO_MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000

ro:
  security:
    jwt-secret: ${RO_JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
    cors-origins: ${RO_CORS_ORIGINS:http://localhost:4200}
    access-token-ttl: ${RO_ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${RO_REFRESH_TOKEN_TTL:14d}
  files:
    dir: ${RO_FILES_DIR:data/files}
  orders:
    web-base-url: ${RO_WEB_URL:http://localhost:4200}
  notifications:
    mail-host: ${RO_MAIL_HOST:}
    from: ${RO_MAIL_FROM:}
    admin-email: ${RO_NOTIFY_EMAIL:${RO_ADMIN_EMAIL:}}
  bootstrap:
    admin-email: ${RO_ADMIN_EMAIL:admin@research-office.local}
    admin-password: ${RO_ADMIN_PASSWORD:ChangeMe#2026}
    admin-name: ${RO_ADMIN_NAME:مدير النظام}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    # Email is optional and best-effort; an unreachable SMTP server must not mark the app DOWN.
    mail:
      enabled: false

springdoc:
  api-docs:
    path: /v3/api-docs
